name: Go CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    # ParadeDB = Postgres + pgvector + ParadeDB extensions; same image used in
    # production (scripts/postgres-up.sh) so CI exercises the real SQL paths
    # in internal/memory (Upsert/Get/MarkSuperseded, ApplyMigrations, Retrieve)
    # instead of mocking them. Tests that need it read DATABASE_URL; the rest
    # ignore it.
    services:
      postgres:
        image: paradedb/paradedb:latest
        env:
          POSTGRES_USER: ptolemy
          POSTGRES_PASSWORD: ptolemy
          POSTGRES_DB: ptolemy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install runtime test deps (tmux, ripgrep)
        run: sudo apt-get update && sudo apt-get install -y tmux ripgrep

      - name: Configure git for tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Run unit tests with coverage
        # -coverpkg restricts the coverage denominator to library code under
        # internal/. cmd/ entry points are pure wiring and intentionally
        # excluded from the 80% threshold.
        env:
          DATABASE_URL: postgres://ptolemy:ptolemy@localhost:5432/ptolemy?sslmode=disable
        run: go test -covermode=atomic -coverpkg=./internal/... -coverprofile=coverage.out ./...

      - name: Validate coverage threshold (80%)
        shell: bash
        run: |
          total_coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')"
          echo "Total coverage: ${total_coverage}%"
          awk -v c="${total_coverage}" 'BEGIN { if (c+0 < 80) { exit 1 } }'

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run integration tests
        run: go test -tags=integration ./...
