pack_id: ptolemy-execute-metadata
name: Ptolemy Execute Metadata
version: 1
created_by: codex

entrypoint: TASK_PLAN.md

folders:
  inbox: inbox
  scripts: scripts
  task_scripts: task-scripts
  snippets: snippets

execution_mode: sequential_first

requires:
  - git

validation:
  - /usr/local/go/bin/go test ./internal/mcp/executortools ./internal/executor ./internal/httpapi
  - /usr/local/go/bin/go test ./...

rules:
  max_allowed_files: 16
  require_validation: true
  require_branch: true
  stop_on_failure: true
