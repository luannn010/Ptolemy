pack_id: ptolemy-agent-kb-hooks
name: Ptolemy Agent KB Hooks
version: 1
created_by: codex

entrypoint: TASK_PLAN.md

folders:
  inbox: inbox
  scripts: scripts
  task_scripts: task-scripts
  snippets: snippets

execution_mode: sequential_first

requires:
  - git

validation:
  - /usr/local/go/bin/go test ./cmd/ptolemy-agent ./internal/tasks

rules:
  max_allowed_files: 12
  require_validation: true
  require_branch: true
  stop_on_failure: true
