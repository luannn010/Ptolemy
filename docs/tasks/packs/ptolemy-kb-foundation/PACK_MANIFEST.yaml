pack_id: ptolemy-kb-foundation
name: Ptolemy KB Foundation
version: 1
created_by: codex

entrypoint: TASK_PLAN.md

folders:
  inbox: inbox
  scripts: scripts
  task_scripts: task-scripts
  snippets: snippets

execution_mode: sequential_first

requires:
  - git

validation:
  - /usr/local/go/bin/go test ./internal/navigator ./internal/memory

rules:
  max_allowed_files: 12
  require_validation: true
  require_branch: true
  stop_on_failure: true
