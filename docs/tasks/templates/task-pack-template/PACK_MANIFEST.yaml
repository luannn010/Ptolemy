pack_id: <pack-id>
name: <Pack Name>
version: 1
created_by: codex

entrypoint: TASK_PLAN.md

folders:
  inbox: inbox
  scripts: scripts
  task_scripts: task-scripts
  snippets: snippets

execution_mode: sequential_first

requires:
  - git

validation:
  - go test ./...

rules:
  max_allowed_files: 8
  require_validation: true
  require_branch: true
  stop_on_failure: true
  branch_strategy: task_sub_branches
  require_pr: true
  pr_template: .github/pull_request_template.md
  auto_generate_readme: true
  enforce_readme_report: true